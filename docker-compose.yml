version: '3.8'
services:
  backend:
    build: .
    container_name: momo-blog-server
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_PATH=/app/data/momoblog.db
      - JWT_SECRET=${JWT_SECRET}
      - CLIENT_ORIGIN=${CLIENT_ORIGIN:-http://localhost}
      - UPLOAD_DIR=/app/images
    volumes:
      - backend-data:/app/data
      - backend-images:/app/images
      - backend-logs:/app/logs
    restart: unless-stopped

  frontend:
    build:
      context: ../momo-blog
    container_name: momo-blog-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
  backend-images:
  backend-logs:
